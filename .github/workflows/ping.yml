name: Keep Supabase Active

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. Run daily away from the top of the hour to
    # reduce the chance of delays caused by peak scheduler load.
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: keep-supabase-active
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PGCONNECT_TIMEOUT: "15"

    steps:
      - name: Validate database secret
        shell: bash
        run: |
          if [[ -z "${DATABASE_URL}" ]]; then
            echo "::error::Missing SUPABASE_DATABASE_URL repository secret."
            exit 1
          fi

      - name: Ensure PostgreSQL client is available
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Run database keep-alive query
        shell: bash
        run: |
          attempt=1

          while [[ "${attempt}" -le 3 ]]; do
            if psql "${DATABASE_URL}" \
              --no-psqlrc \
              --set ON_ERROR_STOP=1 \
              --command "SELECT 1 AS keep_alive;"; then
              exit 0
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "::error::Supabase keep-alive query failed after 3 attempts."
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done
